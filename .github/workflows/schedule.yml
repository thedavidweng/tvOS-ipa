name: Regenerate app listings

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: regenerate-app-listings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required by the manual auto-commit step.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-generation.txt
      - name: Regenerate apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_json.py --token "$GITHUB_TOKEN"
      - name: Commit generated listings
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Automated Change
          commit_options: '--signoff'
          file_pattern: 'apps.json index.html bundleId.csv icons/*'
